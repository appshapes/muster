# Continuous integration: the CLAUDE.md gates that exist today, on both operating
# systems a developer's laptop and an agent's runner use. It runs on every push to
# master, on every pull request, and by hand.
#
# Every action is pinned to a full commit SHA with its version in a trailing comment.
# Tags are mutable: the tj-actions compromise of March 2025 was delivered by moving
# tags. Dependabot (.github/dependabot.yml) opens a pull request when a pinned action
# has a new release; this workflow runs on that pull request before it merges.
#
# The gates jobs run on Blacksmith runners (ADR 0004), the labels Cavalry's and
# Brigade's CI use. Blacksmith serves the GitHub Actions cache API from its own backend,
# so the Rust cache action below works unchanged; the restore lines in a run's log are
# the proof.
#
# The job names are stable on purpose: "gates (linux)" and "gates (macos)" are the two
# checks branch protection on master requires, so renaming a job means updating the
# protection rule in the same change.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # A bound for a hung runner, not a measurement: the first runs on the empty crate are
    # read for their duration, and this moves to twice the slowest cold job once ten
    # runs exist. Cavalry's same five gates without its extra suites took under three
    # minutes cold on these labels.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos
            runner: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # `just lint-docs` diffs the change against its base (ADR 0006)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # mdBook for `just docs`, as a prebuilt binary checked against the action's own
      # manifest, pinned to the version the justfile names; bump both together (ADR 0006).
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: mdbook@0.5.4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just lint
      - run: just test
      - run: just docs
      - run: just lint-docs
      # The README's ten-minute path, end to end, against the fake Linear, on both
      # operating systems (CLAUDE.md, gate 5; ADR 0010).
      - run: just quickstart
