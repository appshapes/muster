# The mdBook that `just docs` builds from docs/ (CLAUDE.md, invariant 6; ADR 0006). The
# output goes under target/, with the rest of the build products. `create-missing` is off
# so that a page listed in docs/SUMMARY.md but absent from disk fails the build instead
# of being created as an empty stub.
[book]
title = "Muster"
description = "A command-line client for Linear, for coding agents first"
authors = ["AppShapes"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/appshapes/muster"
edit-url-template = "https://github.com/appshapes/muster/edit/master/docs/{path}"
